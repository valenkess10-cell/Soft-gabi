name: soft_gabi
description: "MiCantina - pedidos de la cantina escolar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Dibuja los códigos QR sin necesitar internet (la web usaba api.qrserver.com)
  qr_flutter: ^4.1.0
  # Firebase: conexión al proyecto, login y base de datos en tiempo real.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  # Para que la vendedora pueda elegir/sacar una foto al cargar un producto.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Para probar el provider sin un proyecto de Firebase real (ver test/).
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
